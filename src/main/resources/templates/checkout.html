<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - ShopZone</title>

   <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(99,102,241,0.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(168,85,247,0.10), transparent 35%),
        #f4f6f8;
    color: #111827;
}

/* =========================
   NAVBAR
========================= */

.navbar {
    background: #0b0f19;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.logo span {
    color: #6366f1;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: 0.3s ease;
}

.nav-links a:hover {
    color: #818cf8;
}

/* =========================
   CHECKOUT CONTAINER
========================= */

.checkout-container {
    width: 85%;
    max-width: 1100px;
    margin: 55px auto 70px;
}

.checkout-container h1 {
    font-size: 40px;
    font-weight: 800;
    margin-bottom: 30px;
}

/* =========================
   CHECKOUT BOX
========================= */

.checkout-box {
    background: rgba(255,255,255,0.97);
    padding: 35px;
    border-radius: 22px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    max-width: 700px;
}

.checkout-box h2 {
    font-size: 24px;
    margin-bottom: 25px;
}

/* =========================
   ERROR MESSAGE
========================= */

.error-message {
    width: 100%;
    margin-bottom: 20px;
    padding: 14px 18px;
    background: #fff1f2;
    border: 1px solid #fecdd3;
    color: #dc2626;
    border-radius: 11px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
}

/* =========================
   FORM
========================= */

.form-group {
    margin-bottom: 21px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 700;
    font-size: 14px;
    color: #374151;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    background: #f9fafb;
    color: #111827;
    transition: 0.3s ease;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #6366f1;
    background: white;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
}

.form-group textarea {
    height: 110px;
    resize: vertical;
}

/* =========================
   PLACE ORDER
========================= */

.place-order-btn {
    width: 100%;
    padding: 15px;
    background: #111827;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s ease;
}

.place-order-btn:hover {
    background: #4f46e5;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(79,70,229,0.25);
}

/* =========================
   BACK BUTTON
========================= */

.back-btn {
    display: inline-block;
    margin-top: 20px;
    color: #4f46e5;
    text-decoration: none;
    font-weight: 700;
    transition: 0.3s ease;
}

.back-btn:hover {
    color: #3730a3;
    transform: translateX(-3px);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .navbar {
        flex-direction: column;
        gap: 15px;
    }

    .nav-links {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .checkout-container {
        width: 92%;
        margin: 40px auto;
    }

    .checkout-container h1 {
        font-size: 31px;
    }

    .checkout-box {
        padding: 25px 20px;
    }
}

</style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            ShopZone
        </div>
<div class="nav-links">

    <a href="/">Home</a>

</div>
        <div class="nav-links">

            <a href="/products">
                Products
            </a>

            <a href="/cart">
                🛒 Cart
            </a>

        </div>

    </nav>


    <!-- CHECKOUT -->

    <div class="checkout-container">

        <h1>
            Checkout
        </h1>


        <div class="checkout-box">

            <h2>
                Customer Details
            </h2>


            <!-- ERROR MESSAGE -->

            <div th:if="${error}"
                 class="error-message">

                <span>⚠️</span>

                <span th:text="${error}">
                    Product is out of stock.
                </span>

            </div>


            <!-- PLACE ORDER FORM -->

            <form action="/place-order"
                  method="post">

                <!-- NAME -->

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        name="phone"
                        placeholder="Enter your phone number"
                        required>

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label>
                        Delivery Address
                    </label>

                    <textarea
                        name="address"
                        placeholder="Enter your complete delivery address"
                        required></textarea>

                </div>


                <!-- PLACE ORDER BUTTON -->

                <button
                    type="submit"
                    class="place-order-btn">

                    Place Order

                </button>

            </form>


            <!-- BACK TO CART -->

            <a
                href="/cart"
                class="back-btn">

                ← Back to Cart

            </a>

        </div>

    </div>

</body>

</html>
