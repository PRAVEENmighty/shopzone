<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - ShopZone</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6f8;
            color: #111;
        }

        /* NAVBAR */

        .navbar {
            background: #111;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #aaa;
        }

        /* CHECKOUT */

        .checkout-container {
            width: 85%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .checkout-container h1 {
            font-size: 36px;
            margin-bottom: 30px;
        }

        .checkout-box {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            max-width: 700px;
        }

        .checkout-box h2 {
            margin-bottom: 25px;
        }

        /* ERROR MESSAGE */

        .error-message {
            width: 100%;
            margin-bottom: 20px;
            padding: 14px 18px;
            background: #fff1f1;
            border: 1px solid #ffb3b3;
            color: #d60000;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #111;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
        }

        .form-group textarea {
            height: 100px;
            resize: none;
        }

        /* PLACE ORDER */

        .place-order-btn {
            width: 100%;
            padding: 15px;
            background: #111;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .place-order-btn:hover {
            background: #333;
            transform: translateY(-2px);
        }

        /* BACK BUTTON */

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .checkout-container {
                width: 92%;
                margin: 30px auto;
            }

            .checkout-container h1 {
                font-size: 30px;
            }

            .checkout-box {
                padding: 22px;
            }

            .nav-links {
                gap: 15px;
            }
        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            ShopZone
        </div>

        <div class="nav-links">

            <a href="/products">
                Products
            </a>

            <a href="/cart">
                🛒 Cart
            </a>

        </div>

    </nav>


    <!-- CHECKOUT -->

    <div class="checkout-container">

        <h1>
            Checkout
        </h1>


        <div class="checkout-box">

            <h2>
                Customer Details
            </h2>


            <!-- ERROR MESSAGE -->

            <div th:if="${error}"
                 class="error-message">

                <span>⚠️</span>

                <span th:text="${error}">
                    Product is out of stock.
                </span>

            </div>


            <!-- PLACE ORDER FORM -->

            <form action="/place-order"
                  method="post">

                <!-- NAME -->

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        name="phone"
                        placeholder="Enter your phone number"
                        required>

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label>
                        Delivery Address
                    </label>

                    <textarea
                        name="address"
                        placeholder="Enter your complete delivery address"
                        required></textarea>

                </div>


                <!-- PLACE ORDER BUTTON -->

                <button
                    type="submit"
                    class="place-order-btn">

                    Place Order

                </button>

            </form>


            <!-- BACK TO CART -->

            <a
                href="/cart"
                class="back-btn">

                ← Back to Cart

            </a>

        </div>

    </div>

</body>

</html>
