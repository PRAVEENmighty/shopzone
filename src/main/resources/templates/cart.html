<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - ShopZone</title>

    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background:
        radial-gradient(circle at top left, rgba(99,102,241,0.10), transparent 35%),
        #f4f6f8;
    color: #111827;
}

/* =========================
   NAVBAR
========================= */

.navbar {
    background: #0b0f19;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.logo span {
    color: #6366f1;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: 0.3s ease;
}

.nav-links a:hover {
    color: #818cf8;
}

/* =========================
   CART CONTAINER
========================= */

.cart-container {
    width: 85%;
    max-width: 1100px;
    margin: 55px auto 70px;
}

.cart-container h1 {
    font-size: 40px;
    font-weight: 800;
    margin-bottom: 30px;
}

/* =========================
   CART ITEM
========================= */

.cart-item {
    background: white;
    padding: 25px;
    border-radius: 20px;
    margin-bottom: 20px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.3s ease;
}

.cart-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.10);
}

.item-info h2 {
    font-size: 21px;
    margin-bottom: 10px;
}

.item-info p {
    color: #6b7280;
    margin: 8px 0;
    font-size: 14px;
}

/* =========================
   QUANTITY
========================= */

.quantity-box {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
}

.quantity-btn {
    display: inline-flex;
    width: 34px;
    height: 34px;
    align-items: center;
    justify-content: center;
    background: #111827;
    color: white;
    text-decoration: none;
    border-radius: 9px;
    font-size: 19px;
    font-weight: bold;
    transition: 0.3s ease;
}

.quantity-btn:hover {
    background: #4f46e5;
    transform: translateY(-2px);
}

.quantity-number {
    min-width: 30px;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
}

/* =========================
   PRICE
========================= */

.item-price {
    text-align: right;
}

.item-price .subtotal {
    font-size: 23px;
    font-weight: 800;
    margin-bottom: 12px;
    color: #111827;
}

/* =========================
   REMOVE BUTTON
========================= */

.remove-btn {
    display: inline-block;
    padding: 10px 17px;
    background: #ef4444;
    color: white;
    border-radius: 9px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    transition: 0.3s ease;
}

.remove-btn:hover {
    background: #dc2626;
    transform: translateY(-2px);
}

/* =========================
   TOTAL
========================= */

.total-box {
    background: white;
    padding: 28px;
    border-radius: 20px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    text-align: right;
}

.total-box h2 {
    margin-bottom: 20px;
    font-size: 25px;
}

/* =========================
   CHECKOUT
========================= */

.checkout-btn {
    display: inline-block;
    padding: 14px 30px;
    background: #111827;
    color: white;
    border-radius: 11px;
    text-decoration: none;
    font-weight: 700;
    transition: 0.3s ease;
}

.checkout-btn:hover {
    background: #4f46e5;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(79,70,229,0.25);
}

/* =========================
   EMPTY CART
========================= */

.empty-cart {
    background: white;
    padding: 75px 20px;
    border-radius: 22px;
    text-align: center;
    border: 1px solid #e5e7eb;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
}

.empty-cart h2 {
    font-size: 28px;
    margin-bottom: 15px;
}

.empty-cart p {
    color: #6b7280;
    margin-bottom: 25px;
}

.shop-btn {
    display: inline-block;
    padding: 13px 27px;
    background: #111827;
    color: white;
    text-decoration: none;
    border-radius: 11px;
    font-weight: 700;
    transition: 0.3s ease;
}

.shop-btn:hover {
    background: #4f46e5;
    transform: translateY(-2px);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .navbar {
        flex-direction: column;
        gap: 15px;
    }

    .nav-links {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .cart-container {
        width: 92%;
        margin-top: 40px;
    }

    .cart-container h1 {
        font-size: 31px;
    }

    .cart-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 22px;
    }

    .item-price {
        text-align: left;
    }

    .total-box {
        text-align: left;
    }
}

</style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            ShopZone
        </div>
<div class="nav-links">

    <a href="/">Home</a>

</div>

        <div class="nav-links">

            <a href="/products">
                Products
            </a>

            <a href="/add-product">
                Add Product
            </a>

            <a href="/cart">
                🛒 Cart
            </a>

        </div>


    </nav>


    <!-- CART -->

    <div class="cart-container">

        <h1>
            Shopping Cart
        </h1>


        <!-- EMPTY CART -->

        <div th:if="${cartItems.isEmpty()}"
             class="empty-cart">

            <h2>
                Your Cart is Empty
            </h2>

            <p>
                Add some products to your cart and they will appear here.
            </p>

            <a href="/products"
               class="shop-btn">

                Continue Shopping

            </a>

        </div>


        <!-- CART ITEMS -->

        <div th:unless="${cartItems.isEmpty()}">

            <div class="cart-item"
                 th:each="item : ${cartItems}">


                <!-- PRODUCT INFORMATION -->

                <div class="item-info">

                    <h2 th:text="${item.product.name}">
                        Product Name
                    </h2>

                    <p th:text="${item.product.description}">
                        Product Description
                    </p>


                    <!-- QUANTITY -->

                    <div class="quantity-box">

                        <span>
                            Quantity:
                        </span>


                        <!-- DECREASE -->

                        <a th:href="@{/decrease-quantity/{id}(id=${item.id})}"
                           class="quantity-btn">

                            −

                        </a>


                        <!-- QUANTITY NUMBER -->

                        <strong th:text="${item.quantity}"
                                class="quantity-number">

                            1

                        </strong>


                        <!-- INCREASE -->

                        <a th:href="@{/increase-quantity/{id}(id=${item.id})}"
                           class="quantity-btn">

                            +

                        </a>

                    </div>


                    <!-- PRODUCT PRICE -->

                    <p>

                        Price:

                        ₹<span th:text="${item.product.price}">
                            0
                        </span>

                    </p>

                </div>


                <!-- PRICE + REMOVE -->

                <div class="item-price">

                    <p>
                        Subtotal
                    </p>


                    <p class="subtotal">

                        ₹<span th:text="${item.product.price * item.quantity}">
                            0
                        </span>

                    </p>


                    <!-- REMOVE -->

                    <a th:href="@{/remove-from-cart/{id}(id=${item.id})}"
                       class="remove-btn"
                       onclick="return confirm('Are you sure you want to remove this product?');">

                        🗑️ Remove

                    </a>

                </div>

            </div>


            <!-- TOTAL -->

            <div class="total-box">

                <h2>

                    Grand Total:

                    ₹<span th:text="${total}">
                        0
                    </span>

                </h2>


               <a href="/checkout"
   class="checkout-btn">

    Proceed to Checkout

</a>

            </div>

        </div>

    </div>

</body>

</html>
