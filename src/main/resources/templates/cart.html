<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - ShopZone</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6f8;
            color: #111;
        }

        /* NAVBAR */

        .navbar {
            background: #111;
            color: white;
            padding: 20px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #aaa;
        }

        /* CART CONTAINER */

        .cart-container {
            width: 85%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .cart-container h1 {
            font-size: 36px;
            margin-bottom: 30px;
        }

        /* CART ITEM */

        .cart-item {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 20px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info h2 {
            margin-bottom: 10px;
        }

        .item-info p {
            color: #666;
            margin: 8px 0;
        }

        /* QUANTITY */

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .quantity-btn {
            display: inline-flex;

            width: 32px;
            height: 32px;

            align-items: center;
            justify-content: center;

            background: #111;
            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-size: 20px;
            font-weight: bold;

            transition: 0.3s;
        }

        .quantity-btn:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .quantity-number {
            min-width: 25px;
            text-align: center;

            font-size: 17px;
            font-weight: bold;
        }

        /* PRICE */

        .item-price {
            text-align: right;
        }

        .item-price .subtotal {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* REMOVE BUTTON */

        .remove-btn {
            display: inline-block;

            padding: 10px 16px;

            background: #dc2626;
            color: white;

            border-radius: 8px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition: 0.3s;
        }

        .remove-btn:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }

        /* TOTAL */

        .total-box {
            background: white;
            padding: 25px;

            border-radius: 18px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);

            text-align: right;
        }

        .total-box h2 {
            margin-bottom: 20px;
        }

        /* CHECKOUT */

        .checkout-btn {
            display: inline-block;

            padding: 14px 28px;

            background: #111;
            color: white;

            border-radius: 10px;

            text-decoration: none;
            font-weight: bold;

            transition: 0.3s;
        }

        .checkout-btn:hover {
            background: #333;
            transform: translateY(-2px);
        }

        /* EMPTY CART */

        .empty-cart {
            background: white;
            padding: 70px 20px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .empty-cart h2 {
            margin-bottom: 15px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;

            padding: 13px 25px;

            background: #111;
            color: white;

            text-decoration: none;

            border-radius: 10px;
        }

        .shop-btn:hover {
            background: #333;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .cart-container {
                width: 92%;
            }

            .cart-container h1 {
                font-size: 30px;
            }

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .item-price {
                text-align: left;
            }

            .total-box {
                text-align: left;
            }

        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            ShopZone
        </div>

        <div class="nav-links">

            <a href="/products">
                Products
            </a>

            <a href="/add-product">
                Add Product
            </a>

            <a href="/cart">
                🛒 Cart
            </a>

        </div>

    </nav>


    <!-- CART -->

    <div class="cart-container">

        <h1>
            Shopping Cart
        </h1>


        <!-- EMPTY CART -->

        <div th:if="${cartItems.isEmpty()}"
             class="empty-cart">

            <h2>
                Your Cart is Empty
            </h2>

            <p>
                Add some products to your cart and they will appear here.
            </p>

            <a href="/products"
               class="shop-btn">

                Continue Shopping

            </a>

        </div>


        <!-- CART ITEMS -->

        <div th:unless="${cartItems.isEmpty()}">

            <div class="cart-item"
                 th:each="item : ${cartItems}">


                <!-- PRODUCT INFORMATION -->

                <div class="item-info">

                    <h2 th:text="${item.product.name}">
                        Product Name
                    </h2>

                    <p th:text="${item.product.description}">
                        Product Description
                    </p>


                    <!-- QUANTITY -->

                    <div class="quantity-box">

                        <span>
                            Quantity:
                        </span>


                        <!-- DECREASE -->

                        <a th:href="@{/decrease-quantity/{id}(id=${item.id})}"
                           class="quantity-btn">

                            −

                        </a>


                        <!-- QUANTITY NUMBER -->

                        <strong th:text="${item.quantity}"
                                class="quantity-number">

                            1

                        </strong>


                        <!-- INCREASE -->

                        <a th:href="@{/increase-quantity/{id}(id=${item.id})}"
                           class="quantity-btn">

                            +

                        </a>

                    </div>


                    <!-- PRODUCT PRICE -->

                    <p>

                        Price:

                        ₹<span th:text="${item.product.price}">
                            0
                        </span>

                    </p>

                </div>


                <!-- PRICE + REMOVE -->

                <div class="item-price">

                    <p>
                        Subtotal
                    </p>


                    <p class="subtotal">

                        ₹<span th:text="${item.product.price * item.quantity}">
                            0
                        </span>

                    </p>


                    <!-- REMOVE -->

                    <a th:href="@{/remove-from-cart/{id}(id=${item.id})}"
                       class="remove-btn"
                       onclick="return confirm('Are you sure you want to remove this product?');">

                        🗑️ Remove

                    </a>

                </div>

            </div>


            <!-- TOTAL -->

            <div class="total-box">

                <h2>

                    Grand Total:

                    ₹<span th:text="${total}">
                        0
                    </span>

                </h2>


               <a href="/checkout"
   class="checkout-btn">

    Proceed to Checkout

</a>

            </div>

        </div>

    </div>

</body>

</html>
