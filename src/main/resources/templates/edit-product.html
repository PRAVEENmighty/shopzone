<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product - ShopZone</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f6f8;
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Edit Product</h1>

        <form action="/edit-product" method="post">

            <input type="hidden"
                   name="id"
                   th:value="${product.id}">

            <label>Product Name</label>

            <input type="text"
                   name="name"
                   th:value="${product.name}"
                   required>


            <label>Description</label>

            <textarea name="description"
                      th:text="${product.description}"
                      required></textarea>


            <label>Price</label>

            <input type="number"
                   name="price"
                   step="0.01"
                   th:value="${product.price}"
                   required>


            <label>Image URL</label>

            <input type="text"
                   name="imageUrl"
                   th:value="${product.imageUrl}">


            <label>Quantity</label>

            <input type="number"
                   name="quantity"
                   th:value="${product.quantity}"
                   required>


            <button type="submit">
                Update Product
            </button>

        </form>

        <a href="/products" class="back">
            ← Back to Products
        </a>

    </div>

</body>

</html>
