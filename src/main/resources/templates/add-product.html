<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product - ShopZone</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        label {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Add Product</h1>

        <form action="/add-product" method="post">

            <label>Product Name</label>
            <input type="text"
                   name="name"
                   placeholder="Enter product name"
                   required>

            <label>Description</label>
            <textarea name="description"
                      placeholder="Enter product description"
                      required></textarea>

            <label>Price</label>
            <input type="number"
                   name="price"
                   step="0.01"
                   placeholder="Enter price"
                   required>

            <label>Image URL</label>
            <input type="text"
                   name="imageUrl"
                   placeholder="Enter image URL">

            <label>Quantity</label>
            <input type="number"
                   name="quantity"
                   placeholder="Enter stock quantity"
                   required>

            <button type="submit">
                Add Product
            </button>

        </form>

    </div>

</body>

</html>
