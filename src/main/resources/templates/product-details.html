<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${product.name} + ' - ShopZone'">
        Product Details
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f6f8;
            color: #111;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: #111;
            color: white;

            padding: 20px 7%;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #bbb;
        }

        /* =========================
           PRODUCT
        ========================= */

        .product-container {
            width: 85%;
            max-width: 1100px;

            margin: 60px auto;

            background: white;

            border-radius: 25px;

            padding: 40px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 50px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.1);
        }

        /* =========================
           IMAGE
        ========================= */

        .product-image {
            width: 100%;

            height: 450px;

            border-radius: 20px;

            overflow: hidden;

            background: #eee;
        }

        .product-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        /* =========================
           DETAILS
        ========================= */

        .details {
            display: flex;

            flex-direction: column;

            justify-content: center;
        }

        .details h1 {
            font-size: 40px;

            margin-bottom: 15px;
        }

        .category {
            display: inline-block;

            width: fit-content;

            padding: 7px 14px;

            margin-bottom: 20px;

            background: #eef2ff;

            color: #4f46e5;

            border-radius: 20px;

            font-size: 14px;

            font-weight: bold;
        }

        .description {
            color: #666;

            line-height: 1.7;

            margin-bottom: 25px;
        }

        .price {
            font-size: 32px;

            font-weight: bold;

            margin-bottom: 15px;
        }

        .stock {
            color: #159447;

            margin-bottom: 30px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;

            gap: 12px;
        }

        .cart-btn {
            flex: 1;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #111;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .cart-btn:hover {
            background: #333;
        }

        .back-btn {
            flex: 1;

            padding: 15px;

            border-radius: 12px;

            background: #eee;

            color: #111;

            text-align: center;

            text-decoration: none;
        }

        .back-btn:hover {
            background: #ddd;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            .product-container {
                grid-template-columns: 1fr;

                padding: 25px;
            }

            .product-image {
                height: 300px;
            }

            .details h1 {
                font-size: 30px;
            }

            .navbar {
                padding: 18px 5%;
            }

            .logo {
                font-size: 22px;
            }

        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            ShopZone
        </div>

        <div class="nav-links">

            <a href="/products">
                Products
            </a>

            <a href="/add-product">
                Add Product
            </a>

        </div>

    </nav>


    <!-- PRODUCT DETAILS -->

    <div class="product-container">

        <!-- IMAGE -->

        <div class="product-image">

            <img
                th:src="${product.imageUrl}"
                alt="Product Image"
                onerror="this.src='https://picsum.photos/600/500';">

        </div>


        <!-- DETAILS -->

        <div class="details">

            <h1 th:text="${product.name}">
                Product Name
            </h1>


            <!-- CATEGORY -->

            <div class="category"
                 th:text="${product.category}">
                Category
            </div>


            <!-- DESCRIPTION -->

            <p class="description"
               th:text="${product.description}">

                Product Description

            </p>


            <!-- PRICE -->

            <p class="price">

                ₹<span th:text="${product.price}">
                    0
                </span>

            </p>


            <!-- STOCK -->

            <p class="stock">

                In Stock:

                <span th:text="${product.quantity}">
                    0
                </span>

            </p>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    class="cart-btn"
                    onclick="alert('Product added to cart!')">

                    🛒 Add to Cart

                </button>

                <a
                    href="/products"
                    class="back-btn">

                    ← Back

                </a>

            </div>

        </div>

    </div>

</body>

</html>
