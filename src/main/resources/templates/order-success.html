<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Successful - ShopZone</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background: #f5f6f8;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-box {
            width: 90%;
            max-width: 550px;

            background: white;

            padding: 50px 30px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #111;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;
        }

        .success-box h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .success-box p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            padding: 13px 25px;

            border-radius: 10px;

            text-decoration: none;

            font-weight: bold;
        }

        .products-btn {
            background: #111;
            color: white;
        }

        .products-btn:hover {
            background: #333;
        }

        .home-btn {
            border: 1px solid #ddd;
            color: #111;
        }

        .home-btn:hover {
            background: #f5f5f5;
        }

    </style>

</head>

<body>

    <div class="success-box">

        <div class="success-icon">
            ✓
        </div>

        <h1>
            Order Placed Successfully!
        </h1>

        <p>
            Thank you for your order.
            Your order has been successfully placed
            and will be processed soon.
        </p>

        <div class="buttons">

            <a href="/products"
               class="btn products-btn">

                Continue Shopping

            </a>

            <a href="/cart"
               class="btn home-btn">

                View Cart

            </a>

        </div>

    </div>

</body>

</html>
